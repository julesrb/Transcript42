services:

  transcript42:
    build:
      context: transcript42
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FORTYTWO_UID
        - NEXT_PUBLIC_OAUTH_REDIRECT_URI
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        - NEXT_PUBLIC_APP_URL

    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped
